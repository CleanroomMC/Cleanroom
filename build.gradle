plugins {
    id 'java-library'
    id 'com.cleanroommc.cleanroomgradle'
    id 'com.cleanroommc.conventions' version '1.4.3'
}

base.archivesName = 'cleanroom'

cleanroom {
    mode = 'loader'
    loader {
        accessTransformers.from file('module/forge/src/main/resources/forge_at.cfg')
        sideAnnotationStrippers.from file('module/cleanroom/minecraft.sas')
    }
    runs {
        kirinoClient {
            inherit = 'cleanroomClient'
            configure {
                group 'cleanroom runs'
                description = 'Runs the client with Kirino enabled'
                workingDir = file('run/kirino')
                systemProperty 'crl.dev.kirino', true
            }
        }
    }
}

tokenEnvoy {
    set 'VERSION', project.version
    set 'ID', 'cleanroom'
    set 'BUILD', project.version
    set 'CLEANMIX_VERSION', providers.gradleProperty('cleanmix_version')
}

def modules = [
        'minecraft',
        'forge',
        'cleanroom',
        'kirino',
        'builtin/mixinbooter',
        'builtin/configanytime',
        'builtin/mica'
]

sourceSets {
    main {
        java.srcDirs modules.findAll { it != 'minecraft' }.collect { "module/${it}/src/main/java" }
        // Fixme: Temp
        java.exclude 'com/cleanroommc/kirino/utils/KsmlcUtils.java'
        resources.srcDirs = modules.collect { "module/${it}/src/main/resources" }
    }
    test {
        java.srcDirs = modules.collect { "module/${it}/src/test/java" }
        // Fixme: Temp
        java.exclude 'com/cleanroommc/test/kirino/gl/ksml/**'
        resources.srcDirs = modules.collect { "module/${it}/src/test/resources" }
    }
    benchmark {
        java.srcDirs = modules.collect { "module/${it}/src/benchmark/java" }
    }
}

// Only the builtin and cleanroom modules are formatted for now, patterns are relative to the source directories
def unformatted = [
        'net/minecraft/**',
        'net/minecraftforge/**',
        'ibxm/**',
        'paulscode/**',
        'com/cleanroommc/kirino/**',
        'com/cleanroommc/test/kirino/**'
]

// The builtin modules keep their own licensing and public API
def builtin = [
        'zone/rong/mixinbooter/**',
        'fermiumbooter/**',
        'com/cleanroommc/configanytime/**',
        'com/cleanroommc/client/windows/**'
]

clearSkies {
    exclude(*unformatted, *builtin)
}

formatJ {
    exclude(*unformatted, *builtin)
}

tasks.withType(Checkstyle).configureEach {
    exclude(*unformatted, *builtin)
}

conventions {
    header {
        exclude(*unformatted, *builtin)
    }
}

var open_arguments = [
        '--add-opens=java.base/jdk.internal.loader=ALL-UNNAMED',
        '--add-opens=java.base/jdk.internal.reflect=ALL-UNNAMED',
        '--add-opens=java.base/java.lang=ALL-UNNAMED',
        '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED'
]

var export_arguments = [
        '--add-exports=java.base/jdk.internal.misc=ALL-UNNAMED',
        '--add-exports=java.base/jdk.internal.reflect=ALL-UNNAMED'
]

var library_upgrades = [
        'com.google.guava:guava'              : '33.6.0-jre',
        'com.google.code.gson:gson'           : '2.14.0',
        'it.unimi.dsi:fastutil'               : '8.5.18',
        'org.apache.commons:commons-lang3'    : '3.20.0',
        'commons-io:commons-io'               : '2.22.0',
        'commons-codec:commons-codec'         : '1.22.0',
        'org.apache.commons:commons-compress' : '1.28.0',
        'commons-logging:commons-logging'     : '1.4.0',
        'org.apache.httpcomponents:httpclient': '4.5.14',
        'org.apache.httpcomponents:httpcore'  : '4.4.16',
        'org.apache.logging.log4j:log4j-api'  : '2.26.0',
        'org.apache.logging.log4j:log4j-core' : '2.26.0',
        'net.sf.jopt-simple:jopt-simple'      : '5.0.4',
        'net.java.dev.jna:jna'                : '5.19.1',
        'net.java.jinput:jinput'              : '2.0.10',
        'ca.weblite:java-objc-bridge'         : '1.2',
        'io.netty:netty-all'                  : '4.2.16.Final'
]

configurations.configureEach { configuration ->
    exclude group: 'com.ibm.icu', module: 'icu4j-core-mojang'
    // patchy ships its own copy of io.netty.bootstrap.Bootstrap
    // Against 4.2 netty it shadows the real class and dies on a superclass method that no longer exists
    exclude group: 'com.mojang', module: 'patchy'
    // Vanilla's oshi 1.1 sits under a different group to com.github.oshi, so conflict resolution never drops it
    exclude group: 'oshi-project', module: 'oshi-core'
    // Same with vanilla's JNA platform 3.4.0, renamed to jna-platform since
    exclude group: 'net.java.dev.jna', module: 'platform'
    // jinput 2.0.10 bundles jutils' classes
    exclude group: 'net.java.jutils', module: 'jutils'

    resolutionStrategy.eachDependency { details ->
        var version = library_upgrades["${details.requested.group}:${details.requested.name}"]
        if (version != null) {
            details.useVersion version
        }
        if (details.requested.version != details.target.version) {
            details.because 'Cleanroom Libraries Update'
        }
    }
}

configurations.named('vanillaNatives') {
    // LWJGL 2's natives are never loaded: LWJGLY reaches LWJGL 3's instead.
    exclude group: 'org.lwjgl.lwjgl'
}

['compileClasspath', 'runtimeClasspath', 'testCompileClasspath', 'testRuntimeClasspath'].each { name ->
    configurations.named(name) {
        exclude group: 'org.lwjgl.lwjgl'
    }
}

dependencies {
    constraints {
        library_upgrades.each { coordinate, version -> api "${coordinate}:${version}" }
    }

    // ASM
    def asm_version = providers.gradleProperty('asm_version').get()
    api "org.ow2.asm:asm:${asm_version}"
    api "org.ow2.asm:asm-commons:${asm_version}"
    api "org.ow2.asm:asm-tree:${asm_version}"
    api "org.ow2.asm:asm-util:${asm_version}"
    api "org.ow2.asm:asm-analysis:${asm_version}"
    api "org.ow2.asm:asm-deprecated:7.1"

    // Mixin
    api "com.cleanroommc:cleanmix:${providers.gradleProperty('cleanmix_version').get()}"
    api "com.cleanroommc:mixinextras-common:${providers.gradleProperty('mixinextras_version').get()}"

    compileOnly 'com.cleanroommc:hide-from-userdev:1.0.0'
    api 'org.jspecify:jspecify:1.0.0'
    api 'top.outlands:foundation:0.22.2'
    api 'zone.rong:imaginebreaker:3.2'
    api 'org.javassist:javassist:3.30.2-GA' // FIXME
    api 'lzma:lzma:0.0.1'
    api 'java3d:vecmath:1.5.2' // TODO: joml
    api 'net.sf.trove4j:core:3.1.0'
    api 'net.sf.trove4j:experimental:3.1.0'
    api 'org.apache.maven:maven-artifact:3.9.16'
    api 'org.apache.commons:commons-text:1.15.0'
    api 'org.tukaani:xz:1.12'
    api 'com.ibm.icu:icu4j:78.3'
    api 'org.slf4j:slf4j-api:2.0.18'
    runtimeOnly 'org.apache.logging.log4j:log4j-slf4j2-impl:2.26.0'

    // TODO reconsider
    // Apache HTTP 5
    api 'org.apache.httpcomponents.core5:httpcore5:5.4.3'
    api 'org.apache.httpcomponents.core5:httpcore5-h2:5.4.3'
    api 'org.apache.httpcomponents.client5:httpclient5:5.6.1'

    // Jakarta replacements for APIs that were bundled with Java 8 SE, except javax.inject.
    // Java 8 SE packages: javax.xml.ws and javax.jws
    api 'jakarta.xml.ws:jakarta.xml.ws-api:4.0.3'
    // Java 8 SE package: javax.activation
    api 'jakarta.activation:jakarta.activation-api:2.1.4'
    // Java 8 SE package: javax.annotation
    api 'jakarta.annotation:jakarta.annotation-api:3.0.0'
    // Java 8 SE packages: javax.xml.bind and its subpackages
    api 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.5'
    // TODO: javax.inject was the external JSR-330 API, *NOT* part of Java 8 SE
    api 'jakarta.inject:jakarta.inject-api:2.0.1'

    // TODO reconsider
    // Script engines / XML binding
    api 'org.glassfish.corba:glassfish-corba-omgapi:5.0.2'
    api 'org.openjdk.nashorn:nashorn-core:15.7'
    runtimeOnly 'org.glassfish.jaxb:jaxb-runtime:4.0.9'
    runtimeOnly 'org.glassfish.jaxb:jaxb-core:4.0.9'
    runtimeOnly 'com.sun.istack:istack-commons-runtime:4.2.0'

    // Others
    api 'org.jline:jline:4.1.3'
    api 'com.github.oshi:oshi-core-ffm:7.7.1'
    api 'com.github.oshi:oshi-common:7.7.1'
    api 'net.java.dev.jna:jna-platform:5.19.1'
    // java-objc-bridge bumped here for updated OSX arm64 natives
    api 'ca.weblite:java-objc-bridge:1.2'

    // LWJGL 3
    def lwjgl_version = '3.4.3'
    api platform("org.lwjgl:lwjgl-bom:${lwjgl_version}")
    api 'org.lwjgl:lwjgl'
    api 'org.lwjgl:lwjgl-jemalloc'
    api 'org.lwjgl:lwjgl-opengl'
    api 'org.lwjgl:lwjgl-openal'
    api 'org.lwjgl:lwjgl-stb'
    api 'org.lwjgl:lwjgl-sdl'
    // TODO
    compileOnly 'com.cleanroommc:lwjgly-spi:2.4.0'
    api 'com.cleanroommc:lwjgly:2.4.0'
    lwjglNative "org.lwjgl:lwjgl:${lwjgl_version}"
    lwjglNative "org.lwjgl:lwjgl-jemalloc:${lwjgl_version}"
    lwjglNative "org.lwjgl:lwjgl-opengl:${lwjgl_version}"
    lwjglNative "org.lwjgl:lwjgl-openal:${lwjgl_version}"
    lwjglNative "org.lwjgl:lwjgl-stb:${lwjgl_version}"
    lwjglNative "org.lwjgl:lwjgl-sdl:${lwjgl_version}"

    // Kirino
    api 'org.joml:joml:1.10.9'
    api 'io.github.classgraph:classgraph:4.8.184'
    api 'com.cleanroommc:mcttf:0.1.0'
    api 'org.lwjgl:lwjgl-freetype'
    lwjglNative "org.lwjgl:lwjgl-freetype:${lwjgl_version}"
}

tasks.withType(Test).configureEach {
    maxParallelForks = 1
    jvmArgs open_arguments + export_arguments
}

tasks.register('isolatedTest', Test) {
    description = 'Runs Forge tests that require a fresh JVM.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    forkEvery = 1
    sourceSets.test.java.asFileTree.visit {
        if (!it.directory && it.file.text.contains('@ForgeTestRunner.Isolated')) {
            include it.path.replace('.java', '.class')
        }
    }
    useJUnitPlatform {
        includeTags 'forge-isolated'
    }
}

tasks.named('test', Test) {
    useJUnitPlatform {
        excludeTags 'forge-isolated'
    }
}

tasks.named('check') {
    dependsOn tasks.named('isolatedTest')
}

tasks.named('compileJava', JavaCompile).configure { compile ->
    def v = version.toString()
    doFirst {
        logger.lifecycle("Cleanroom ${v}")
        logger.lifecycle("Java: ${System.getProperty('java.version')} | JVM: ${System.getProperty('java.vm.version')} | Vendor: ${System.getProperty('java.vendor')} | Arch: ${System.getProperty('os.arch')}")
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += export_arguments
}

// Fixme: nothing consumes these at the moment, wastes space
afterEvaluate {
    publishing.publications.named('maven', MavenPublication) {
        artifacts.removeIf { it.classifier in ['sources', 'javadoc'] }
    }
}
