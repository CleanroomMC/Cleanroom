name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  release:
    uses: CleanroomMC/Conventions/.github/workflows/release.yml@1.1.6
    with:
      artifact-path: build/libs/*-universal.jar build/libs/*-installer.jar build/libs/*.zip
      submodules: recursive
      timeout-minutes: 60
      publish-maven: true
    secrets:
      MAVEN_NAME: ${{ secrets.CLEANROOM_MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.CLEANROOM_MAVEN_PASSWORD }}

  download-site:
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger download server update
        run: |
          curl -X POST "https://download.cleanroommc.com/api/webhook" \
            -H "Content-Type: application/json" \
            -d "{\"secret\":\"${{ secrets.DOWNLOAD_UPDATE_TOKEN }}\",\"count\":10,\"token\":\"${{ secrets.DOWNLOAD_UPDATE_GITHUB_TOKEN }}\"}"
