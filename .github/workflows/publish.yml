name: Manually Publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish to Cleanroom Maven
        env:
          ORG_GRADLE_PROJECT_CleanroomUsername: ${{ secrets.CLEANROOM_MAVEN_USERNAME }}
          ORG_GRADLE_PROJECT_CleanroomPassword: ${{ secrets.CLEANROOM_MAVEN_PASSWORD }}
        run: ./gradlew publishAllPublicationsToCleanroomRepository

      - name: Trigger download server update
        run: |
          curl -X POST "https://download.cleanroommc.com/api/webhook" \
            -H "Content-Type: application/json" \
            -d "{\"secret\":\"${{ secrets.DOWNLOAD_UPDATE_TOKEN }}\",\"count\":10,\"token\":\"${{ secrets.DOWNLOAD_UPDATE_GITHUB_TOKEN }}\"}"
